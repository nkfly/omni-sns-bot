# Copy into the private workspace and fill with the editor.
# Do not commit the filled file. Keys are the contract; comments are hints.
version: "0.1"
updated: ""
editor:
  name: ""
  contact: ""
account:
  brand_name: ""
  handle: ""
  platform: threads
  also_platforms: []
  url: ""
  owned_by_editor: false
purpose:
  statement: ""
  reader_should_feel: ""
audience:
  who: ""
  not_for: ""
topics:
  cover: []
  avoid: []
  avoid_confirmed: false  # true also permits an explicitly confirmed empty avoid list.
languages:
  primary: ""
  also: []
  mixing: ""
cadence:
  timezone: ""
  posts_per_week: 0  # Weekly ceiling; retain this key for compatibility.
  min_posts_per_week: 0  # Separate planning minimum; never bypasses approval/cadence.
  max_posts_per_day: 1
  max_replies_per_day: 8  # null = no editor-defined cap; adapter/platform caps still apply.
  windows: []
  # - days: [tue, wed, thu, fri]
  #   start: "19:00"
  #   end: "21:00"
  # Midnight example: start: "19:00", end: "00:00", end_next_day: true
  quiet_hours:
    start: "23:00"
    end: "08:00"
  buffer_min: 3
links:
  allowed: []
  notes: ""
do: []
dont: []
approval:
  level: always_ask
  posts_approved_count: 0
voice:
  source: undecided
  style_guide: style-guide.yaml
  reference_accounts: []  # Separate style sources from account.handle, the managed identity.
  # - handle: ""
  #   url: ""
  #   owned_by_editor: false
  #   purpose: style_reference_only
  #   browser_read_opt_in: false  # Reading consent only; never publication permission.
ai_disclosure:
  # always | editor_decides | never
  policy: editor_decides
  # Meta flag, not a caption. Until the editor picks, do not publish.
  chosen: false
  notes: ""
login:
  # api | browser | draft_only | undecided
  method: undecided
  browser_opt_in: false
faq:
  file: faq.yaml
notes: ""
