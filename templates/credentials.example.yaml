# Documentation only. Do not copy this into a workspace and fill in secrets.
# Set variables in the environment, or point THREADS_TOKEN_FILE at a mode-600
# file outside the git root. The OAuth helper refuses to write inside the repo.
#
# THREADS_APP_ID            Threads App ID (there are two ids on the app; use this one)
# THREADS_APP_SECRET        Threads App secret. Needed to exchange a code.
# THREADS_REDIRECT_URI      Must match the dashboard character for character.
# THREADS_CODE              Authorization code from the redirect, without #_
# THREADS_SCOPES            Optional. Default is the four scopes the v0.1 loop needs.
# THREADS_ACCESS_TOKEN      Long-lived user token.
# THREADS_USER_ID           Numeric Threads user id, or the literal me
# THREADS_TOKEN_FILE        Path outside the git root, mode 600
# THREADS_GRAPH_HOST        Optional. Default https://graph.threads.com
threads:
  app_id_env: THREADS_APP_ID
  app_secret_env: THREADS_APP_SECRET
  redirect_uri_env: THREADS_REDIRECT_URI
  access_token_env: THREADS_ACCESS_TOKEN
  user_id_env: THREADS_USER_ID
  token_file_env: THREADS_TOKEN_FILE
  graph_host_env: THREADS_GRAPH_HOST
