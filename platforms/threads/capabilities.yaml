platform: threads
version: "0.1"
status: implemented
summary: "Official Threads API, plus an opt-in browser fallback and draft_only."
auth:
  - id: official_api
    requires: [http, secret_store, human_channel]
    secret_handling: env_or_mode_600_file_outside_git
  - id: browser
    requires: [browser, human_channel]
    secret_handling: browser_profile_only
    requires_opt_in: true
  - id: draft_only
    requires: [human_channel]
    secret_handling: none
publish:
  text: true
  image: documented
  video: documented
  carousel: documented
  helper_script: text_only
reply:
  read: true
  create: true
  default_scope: own_posts_only
limits_doc: limits.md
docs_checked: "2026-11-02"
graph_hosts:
  - https://graph.threads.com
  - https://graph.threads.net
oauth_authorize: https://threads.com/oauth/authorize
