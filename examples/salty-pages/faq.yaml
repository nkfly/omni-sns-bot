  - id: seating
    questions:
      - 可以坐多久
      - 要不要點餐
      - 有位子嗎
    answer: 可以坐很久。歡迎點一杯。沒點也可以，冰箱不是開放的。
    language: zh-Hant
    sensitivity: low
    source: editor
