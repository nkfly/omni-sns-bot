  - id: consignment
    questions:
      - 可以寄賣嗎
      - 寄賣要多久
    answer: 可以寄賣。店裡看完才上架，有時要兩週。不要寄來一箱然後每天問。
    language: zh-Hant
    sensitivity: low
    source: editor
    updated: "2026-11-02"
    expires: ""
  - id: candy
    questions:
      - 還有海鹽牛奶糖嗎
      - 糖果保存期限
    answer: 海鹽牛奶糖用牛皮紙盒。成分與保存期限印在盒子上。貼文只說有沒有補貨，不報價。
    language: zh-Hant
    sensitivity: medium
    source: editor
    updated: "2026-11-02"
    expires: ""
  - id: wifi
    questions:
      - 有 Wi-Fi 嗎
      - wifi
    answer: 有。密碼貼在櫃檯側面，不寫進貼文或留言。
    language: zh-Hant
    sensitivity: medium
    source: editor
    updated: "2026-11-02"
    expires: ""
  - id: address
    questions:
      - 地址在哪
      - 怎麼去
    answer: 範例地址是虛構的台南市中西區書巷 12 號，不要導航。真實帳號請換成編輯確認過的地址。
    language: zh-Hant
    sensitivity: low
    source: editor
    updated: "2026-11-02"
    expires: ""
  - id: pricing_policy
    questions:
      - 多少錢
      - 有折扣嗎
    answer: 不在貼文或留言報價、不說折扣。請對方到店裡看標價，或等編輯自己回。
    language: zh-Hant
    sensitivity: medium
    source: editor
